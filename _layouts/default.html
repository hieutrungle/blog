<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% feed_meta %}
<link rel="icon" href="https://hieutrungle.github.io/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function () { try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {} })();</script>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
{% if page.math %}<script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>{% endif %}
{% if page.anim %}<script defer src="{{ '/assets/js/anim/lib.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script defer src="{{ '/assets/js/anim/runtime.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>{% endif %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="https://hieutrungle.github.io/">Hieu T. Le</a>
    <button class="menu-btn" aria-expanded="false" aria-controls="sections">Menu</button>
    <nav aria-label="Site" id="sections">
      <ul>
        <li><a href="https://hieutrungle.github.io/">Home</a></li>
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active" aria-current="page"{% endif %}>Blog</a></li>
        <li><a href="{{ '/dissertation/' | relative_url }}"{% if page.url == '/dissertation/' %} class="active" aria-current="page"{% endif %}>Dissertation</a></li>
        <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
      </ul>
    </nav>
    <button class="theme-btn" type="button" aria-label="Toggle light or dark theme" title="Toggle theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<main id="main">
{{ content }}
</main>
<footer>
  <div class="wrap">© {{ 'now' | date: '%Y' }} Hieu T. Le · <a href="https://hieutrungle.github.io/">hieutrungle.github.io</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a></div>
</footer>
<script>
  (function () {
    var root = document.documentElement;
    // Theme toggle: flips relative to what is currently shown, then remembers the choice
    document.querySelector(".theme-btn").addEventListener("click", function () {
      var dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    });
    // Mobile menu
    var header = document.querySelector("header.nav"), btn = document.querySelector(".menu-btn");
    btn.addEventListener("click", function () {
      var open = header.classList.toggle("open"); btn.setAttribute("aria-expanded", open);
    });
    document.querySelectorAll(".nav ul a").forEach(function (a) {
      a.addEventListener("click", function () { header.classList.remove("open"); btn.setAttribute("aria-expanded", false); });
    });
  })();
</script>
</body>
</html>
