title: Hieu T. Le
description: Research, study notes, and knowledge sharing by Hieu T. Le.
author: Hieu T. Le
url: https://hieutrungle.github.io
baseurl: /blog
permalink: /:year/:month/:title/
timezone: America/Chicago
markdown: kramdown
kramdown:
  input: GFM
  math_engine: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
defaults:
  - scope: {path: "", type: posts}
    values: {layout: post}
feed:
  path: feed.xml
# Study series: title, number of the last part, index page (see _includes/series-nav.html)
series_info:
  llm-post-training:
    title: "Sharpen or Expand?"
    last_part: 12
    url: /series/llm-post-training/
exclude:
  - README.md
  - TEMPLATE.md
  - LICENSE
